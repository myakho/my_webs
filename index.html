<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>최애 궁합 테스트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F5F5F7;
    --ink: #17171C;
    --ink-soft: #6E6E78;
    --ink-faint: #A4A4AD;
    --line: #EBEBEF;
    /* 최애를 고르면 JS가 이 네 값을 멤버 색으로 바꾼다 */
    --accent: #17171C;
    --accent-deep: #17171C;
    --accent-line: #17171C;
    --accent-soft: rgba(23, 23, 28, 0.08);
    --accent-on: #FFFFFF;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --font: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }

  .stage {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(16px + var(--safe-t)) 20px 0;
  }

  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  button { font-family: inherit; letter-spacing: inherit; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .dock {
    margin-top: auto;
    position: sticky;
    bottom: 0;
    z-index: 10;
    padding: 20px 0 calc(14px + var(--safe-b));
    background: linear-gradient(to top, var(--bg) 70%, rgba(255, 255, 255, 0));
  }

  .btn {
    width: 100%;
    font-size: 17px;
    font-weight: 700;
    color: var(--accent-on);
    background: var(--accent);
    border: none;
    border-radius: 16px;
    padding: 18px 20px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: var(--surface); color: var(--ink-faint); }

  .btn-sub {
    flex: 1;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    background: var(--surface);
    border: none;
    border-radius: 16px;
    padding: 18px 12px;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  .btn-sub:active { transform: scale(0.98); }

  .btn-text {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 12px 4px 2px;
    cursor: pointer;
  }

  .face { border-radius: 50%; overflow: hidden; background: var(--m-color, var(--surface)); flex-shrink: 0; }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- 1. 인트로 ---------- */

  .intro { margin: auto 0; padding: 24px 0; }

  .crowd { display: flex; margin: 0 0 30px; }
  .crowd .face {
    width: 46px;
    height: 46px;
    margin-left: -12px;
    border: 3px solid var(--bg);
  }
  .crowd .face:first-child { margin-left: 0; }

  .intro h1 {
    font-size: clamp(30px, 8.4vw, 36px);
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: -0.035em;
    margin: 0 0 14px;
  }

  .intro p {
    font-size: 16px;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0;
    word-break: keep-all;
  }

  .intro .meta { font-size: 14px; color: var(--ink-faint); margin-top: 18px; }

  #screen-intro .dock { margin-top: 0; }

  .note {
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink-faint);
    text-align: center;
    margin: 4px 0 0;
    word-break: keep-all;
  }

  /* ---------- 2. 최애 고르기 ---------- */

  .title {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: -0.03em;
    margin: 12px 0 8px;
  }
  .desc { font-size: 15px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 28px; word-break: keep-all; }

  .pick-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px 4px; }

  .pick {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: transform 0.1s ease;
  }
  .pick:active { transform: scale(0.94); }
  .pick .face {
    width: min(58px, 14.5vw);
    aspect-ratio: 1;
    transition: box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .pick .who { font-size: 13px; color: var(--ink-soft); }

  .pick-grid.has-pick .pick .face { opacity: 0.4; }
  .pick-grid.has-pick .pick[aria-pressed="true"] .face {
    opacity: 1;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ring);
  }
  .pick[aria-pressed="true"] .who { color: var(--ink); font-weight: 700; }

  .pick-hint {
    margin: auto 0 0;
    padding: 32px 4px 0;
    text-align: center;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-faint);
    word-break: keep-all;
  }
  .pick-hint .who-big { display: block; font-size: 19px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
  .pick-hint .vibe { color: var(--ink-soft); }

  #screen-pick .dock { display: flex; flex-direction: column; align-items: center; }

  /* ---------- 3. 문항 ---------- */

  #screen-quiz { padding-bottom: calc(14px + var(--safe-b)); }

  .q-head { display: flex; align-items: center; gap: 14px; height: 44px; }

  .back-btn {
    width: 36px;
    height: 36px;
    margin-left: -8px;
    border: none;
    background: none;
    color: var(--ink);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .back-btn:disabled { color: var(--line); }

  .track { flex: 1; height: 6px; border-radius: 999px; background: var(--surface); overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: var(--accent-line); transition: width 0.3s ease; }

  .counter { font-size: 14px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .q-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 16px 0 36px; }

  .q-who { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 14px; font-weight: 600; color: var(--accent-deep); }
  .q-who .face { width: 24px; height: 24px; }

  .question {
    font-size: clamp(22px, 6vw, 25px);
    font-weight: 700;
    line-height: 1.45;
    letter-spacing: -0.03em;
    margin: 0;
    word-break: keep-all;
  }

  .options { display: flex; flex-direction: column; gap: 8px; }

  .opt {
    width: 100%;
    min-height: 58px;
    text-align: left;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 15px 18px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.12s ease, border-color 0.12s ease;
  }
  .opt:active { transform: scale(0.985); }
  .opt[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-deep); font-weight: 700; }

  /* ---------- 4. 결과 ---------- */

  .res-top { text-align: center; padding: 20px 0 36px; }

  .gauge { position: relative; width: 150px; height: 150px; margin: 0 auto 20px; }
  .gauge svg { position: absolute; inset: 0; transform: rotate(-90deg); width: 100%; height: 100%; }
  .gauge .ring-bg { stroke: var(--surface); }
  .gauge .ring-fg { stroke: var(--accent-line); stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(0.22, 0.75, 0.3, 1); }
  .gauge .face { position: absolute; inset: 17px; }

  .res-label { font-size: 15px; font-weight: 600; color: var(--ink-soft); margin: 0 0 2px; }

  .score { margin: 0 0 18px; font-size: 56px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; color: var(--accent-deep); font-variant-numeric: tabular-nums; }
  .score small { font-size: 22px; font-weight: 700; margin-left: 2px; }

  .verdict { font-size: 22px; font-weight: 800; line-height: 1.4; letter-spacing: -0.03em; margin: 0 0 10px; word-break: keep-all; }
  .summary { font-size: 15.5px; line-height: 1.7; color: var(--ink-soft); margin: 0; word-break: keep-all; }

  .section { background: var(--surface); border-radius: 20px; padding: 24px 20px; margin-bottom: 12px; }
  .section h3 { font-size: 18px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 6px; }
  .section .lead { font-size: 14.5px; color: var(--ink-soft); line-height: 1.65; margin: 0 0 18px; word-break: keep-all; }

  .me-kicker { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 0 0 4px; }
  .me-type { font-size: 24px !important; line-height: 1.35; margin: 0 0 12px !important; word-break: keep-all; }
  .me-desc { font-size: 15px; line-height: 1.75; margin: 0 0 20px; word-break: keep-all; }
  .me-row { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 10px; padding: 7px 0; }
  .me-row .nm { font-size: 13px; font-weight: 700; }
  .me-row .scale { height: 32px; margin: 0; }
  .me-row .mark.you { top: 0; }

  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.you { background: var(--ink); }
  .dot.bias { background: var(--accent-line); }

  .axis { padding: 18px 0; border-top: 1px solid var(--line); }
  .axis:first-child { border-top: none; }
  .axis:last-child { padding-bottom: 0; }

  .axis-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .axis-name { font-size: 16px; font-weight: 700; }
  .axis-right { display: flex; align-items: center; gap: 8px; }
  .got { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .got small { font-size: 12px; font-weight: 600; color: var(--ink-faint); }

  .tag { font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 8px; white-space: nowrap; }
  .tag.t3 { background: var(--accent-soft); color: var(--accent-deep); }
  .tag.t2 { background: #E7F4EC; color: #247046; }
  .tag.t1 { background: #FFF2DC; color: #8F5F0B; }
  .tag.t0 { background: #FDE8EB; color: #BE2B45; }

  .scale { position: relative; height: 36px; margin-bottom: 10px; }
  .scale .rail { position: absolute; top: 7px; left: 0; right: 0; height: 4px; border-radius: 999px; background: #E3E3E8; }
  .scale .mark {
    position: absolute; top: 0;
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 3px solid var(--surface);
    transform: translateX(-50%);
  }
  .scale .mark.you { background: var(--ink); z-index: 2; }
  .scale .mark.bias { background: var(--accent-line); }
  .scale .ends { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-faint); }

  .axis-say { font-size: 15px; line-height: 1.7; margin: 0; word-break: keep-all; }

  .points { display: flex; flex-direction: column; gap: 16px; }
  .point { font-size: 15px; line-height: 1.7; margin: 0; word-break: keep-all; }
  .point .lab { display: block; font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .point.good .lab { color: #247046; }
  .point.weak .lab { color: #BE2B45; }

  .rank-list { display: none; flex-direction: column; margin-top: 8px; }
  .rank-list.open { display: flex; }
  .rank { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .rank:first-child { border-top: none; }
  .rank .n { width: 18px; font-size: 14px; font-weight: 700; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .rank .face { width: 34px; height: 34px; }
  .rank .nm { flex: 1; font-size: 15px; }
  .rank .pc { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .rank.is-pick .nm { font-weight: 700; }
  .rank .mine { margin-left: 6px; font-size: 11px; font-weight: 700; color: var(--accent-deep); background: var(--accent-soft); padding: 2px 6px; border-radius: 6px; vertical-align: 2px; }

  .toggle {
    width: 100%;
    background: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }

  #screen-result .dock { display: flex; gap: 8px; }
  #screen-result .dock .btn { flex: 1.4; width: auto; }

  @media (hover: hover) {
    .opt:hover { border-color: var(--line); }
    .opt[aria-pressed="true"]:hover { border-color: var(--accent-line); }
    .btn-text:hover { color: var(--ink); }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 345px) {
    .stage { padding-left: 16px; padding-right: 16px; }
    .crowd .face { width: 40px; height: 40px; margin-left: -13px; }
    .pick .who { font-size: 12px; }
  }

  @media (max-height: 620px) and (min-height: 481px) {
    .q-body { padding: 10px 0 20px; }
    .opt { min-height: 52px; padding: 13px 16px; }
  }

  @media (max-height: 480px) {
    .stage { padding-top: calc(6px + var(--safe-t)); }
    #screen-quiz { padding-bottom: calc(6px + var(--safe-b)); }
    .q-head { height: 36px; }
    .q-body { padding: 4px 0 10px; }
    .q-who { display: none; }
    .question { font-size: 19px; }
    .options { gap: 5px; }
    .opt { min-height: 42px; padding: 9px 14px; font-size: 15px; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- ===== 1. 인트로 ===== -->
  <section id="screen-intro" class="screen active">
    <div class="intro">
      <div class="crowd" id="crowd"></div>
      <h1>최애랑 나,<br>얼마나 잘 맞을까?</h1>
      <p>텐션, 거리감, 유머 코드, 몰입 방식, 감정 표현. 다섯 가지로 나와 최애가 얼마나 겹치는지 계산하고, 왜 그런 점수가 나왔는지 하나씩 알려드려요.</p>
      <p class="meta">20문항, 3분이면 끝나요</p>
    </div>
    <div class="dock">
      <button class="btn" id="to-pick">시작하기</button>
      <p class="note">비공식 팬메이드 테스트예요. 멤버 성향은 방송에서 보이는 모습을 바탕으로 한 해석이에요.</p>
    </div>
  </section>

  <!-- ===== 2. 최애 고르기 ===== -->
  <section id="screen-pick" class="screen">
    <h2 class="title">누구와의 궁합을 볼까요?</h2>
    <p class="desc">고른 멤버 기준으로 계산해요. 다른 멤버와의 궁합도 결과에서 같이 보여드려요.</p>
    <div class="pick-grid" id="pick-grid"></div>
    <div class="pick-hint" id="pick-hint"></div>
    <div class="dock">
      <button class="btn" id="to-quiz" disabled>한 명을 골라주세요</button>
      <button class="btn-text" id="back-intro">처음으로</button>
    </div>
  </section>

  <!-- ===== 3. 문항 ===== -->
  <section id="screen-quiz" class="screen">
    <div class="q-head">
      <button class="back-btn" id="back-q" aria-label="이전 질문">‹</button>
      <div class="track"><div class="fill" id="fill"></div></div>
      <span class="counter" id="counter">1/20</span>
    </div>
    <div class="q-body">
      <div class="q-who"><span class="face" id="q-face"></span><span id="counter-who"></span></div>
      <p class="question" id="question"></p>
    </div>
    <div class="options" id="options"></div>
  </section>

  <!-- ===== 4. 결과 ===== -->
  <section id="screen-result" class="screen">
    <div class="res-top">
      <div class="gauge">
        <svg viewBox="0 0 150 150">
          <circle class="ring-bg" cx="75" cy="75" r="68" fill="none" stroke-width="8"/>
          <circle class="ring-fg" id="ring" cx="75" cy="75" r="68" fill="none" stroke-width="8"
                  stroke-dasharray="427.3" stroke-dashoffset="427.3"/>
        </svg>
        <span class="face" id="res-face"></span>
      </div>
      <p class="res-label" id="res-label"></p>
      <p class="score"><span id="score-num">0</span><small>점</small></p>
      <h2 class="verdict" id="verdict"></h2>
      <p class="summary" id="summary"></p>
    </div>

    <div class="section me">
      <p class="me-kicker">검사로 본 내 성향</p>
      <h3 class="me-type" id="me-type"></h3>
      <p class="me-desc" id="me-desc"></p>
      <div class="me-bars" id="me-bars"></div>
    </div>

    <div class="section">
      <h3>왜 이렇게 나왔을까</h3>
      <p class="lead" id="why-lead"></p>
      <div class="legend">
        <span><i class="dot you"></i>나</span>
        <span><i class="dot bias"></i><span id="legend-name"></span></span>
      </div>
      <div id="axes"></div>
    </div>

    <div class="section">
      <h3>한 줄로 정리하면</h3>
      <div class="points" id="points"></div>
    </div>

    <div class="section">
      <h3>다른 멤버와는 어떨까</h3>
      <p class="lead" id="rank-lead"></p>
      <button class="toggle" id="rank-toggle">전체 순위 보기</button>
      <div class="rank-list" id="rank-list"></div>
    </div>

    <div class="dock">
      <button class="btn-sub" id="retry">다시 하기</button>
      <button class="btn" id="share">결과 공유하기</button>
    </div>
  </section>

</div>

<script>
/* ---------------- 축 정의 ---------------- */
/* pts: 이 축의 배점(합계 100)
   tol: 이 정도 차이까지는 서로 보완되는 범위로 보고 감점하지 않는다 */
const AXES = [
  { key:'TEN', name:'텐션',      low:'잔잔하게',   high:'시끌벅적하게', pts:16, tol:20 },
  { key:'DIS', name:'거리감',    low:'선을 지키는', high:'스스럼없는',   pts:24, tol:0  },
  { key:'HUM', name:'유머 코드', low:'다정한 말',   high:'팩폭과 장난',  pts:26, tol:0  },
  { key:'FOC', name:'몰입 방식', low:'즉흥적으로',  high:'진득하게',     pts:18, tol:8  },
  { key:'EMO', name:'감정 표현', low:'담담하게',    high:'솔직하게',     pts:16, tol:8  }
];
/* 위치 차이(허용 폭을 뺀 값)가 커질수록 받는 비율이 줄어드는 정도.
   차이 12 → 85%, 23 → 55%, 38 → 20%, 60 → 2% */
const SPREAD = 30;

const QUESTIONS = [
  { axis:'TEN', rev:false, text:'웃음소리가 끊이지 않는 시끌벅적한 자리가 나는 더 편하다.' },
  { axis:'TEN', rev:true,  text:'잔잔하게 흘러가는 조용한 분위기가 나한테는 제일 잘 맞는다.' },
  { axis:'TEN', rev:false, text:'좋아하는 게 생기면 목소리부터 커지고 혼자 신나서 떠든다.' },
  { axis:'TEN', rev:true,  text:'텐션이 계속 높게 유지되는 자리에 있으면 나중엔 기가 빨린다.' },

  { axis:'DIS', rev:false, text:'좀 친해졌다 싶으면 존댓말부터 빼고 편하게 대하는 편이다.' },
  { axis:'DIS', rev:true,  text:'아무리 친해져도 지켜야 할 선은 있다고 생각한다.' },

         lo:{ adj:'담담한',       noun:'포커페이스',   say:'웬만한 일에는 흔들리지 않고, 감정은 안에서 조용히 정리해요.' },
         mid:'감정을 숨기지도 과하게 드러내지도 않는 편이에요.' }
};

function myType(u) {
  const rank = AXES.map(a => ({ a, d: Math.abs(u[a.key] - 50), pole: u[a.key] >= 50 ? 'hi' : 'lo' }))
                   .sort((x, y) => y.d - x.d || y.a.pts - x.a.pts);   // 동점이면 배점이 큰 기준 우선
  const [first, second] = rank;
  let name;
  if (first.d < 15) name = '균형 잡힌 올라운더';
  else if (second.d < 12) name = `누가 봐도 ${TRAITS[first.a.key][first.pole].noun}`;
  else name = `${TRAITS[second.a.key][second.pole].adj} ${TRAITS[first.a.key][first.pole].noun}`;
  const lines = rank.slice(0, 3).map(r => r.d >= 15 ? TRAITS[r.a.key][r.pole].say : TRAITS[r.a.key].mid);
  return { name, lines };
}

/* ---------------- 조사 처리 ---------------- */
function batchim(w) {
  const c = w.charCodeAt(w.length - 1);
  return c >= 0xAC00 && c <= 0xD7A3 ? (c - 0xAC00) % 28 !== 0 : false;
}
const P = {
  iga: n => n + (batchim(n) ? '이' : '가'),
  eun: n => n + (batchim(n) ? '은' : '는'),
  gwa: n => n + (batchim(n) ? '과' : '와'),
  i: n => batchim(n) ? '이' : '가'
};

/* ---------------- 축별 해설 문장 ---------------- */

const BANDS = [

  { min:70, title:'오래 갈 수 있는 궁합이에요',        text:n=>`${P.gwa(n)} 큰 충돌 없이 맞물리는 조합이에요. 방송을 켜두기만 해도 편안한 쪽에 가까워요.` },
  { min:55, title:'무난하게 잘 맞아요',                text:n=>`${P.gwa(n)} 기본은 잘 맞고, 몇 가지 결만 이해하면 훨씬 편해지는 사이예요.` },

  { min:0,  title:'성향은 정반대에 가까워요',           text:n=>`${P.gwa(n)} 성향이 꽤 다르게 나왔어요. 그런데 최애는 나랑 닮은 사람보다 나한테 없는 걸 가진 사람이 되는 경우가 더 많아요.` }

let biasId = null;
let idx = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let lastResult = null;

const $ = id => document.getElementById(id);
const memberById = id => MEMBERS.find(m => m.id === id);
const faceHTML = m => `<img src="${m.img}" alt="">`;

function show(id) {

  $(id).classList.add('active');

/* ---------------- 멤버 색 테마 ---------------- */
function hexRgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); }
function lum(rgb) {
  const f = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
}
function rgbHsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h / 6, s, l];
}
function hslRgb([h, s, l]) {
  if (s === 0) return [l, l, l].map(v => Math.round(v * 255));
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1/6 ? p + (q - p) * 6 * t : t < 1/2 ? q : t < 2/3 ? p + (q - p) * (2/3 - t) * 6 : p; };
  return [f(h + 1/3), f(h), f(h - 1/3)].map(v => Math.round(v * 255));
}
// 색상과 채도는 유지하고 밝기만 내려서 목표 휘도 이하로 맞춘다
function darkenTo(hex, target) {
  let [h, s, l] = rgbHsl(hexRgb(hex));
  s = Math.min(1, s * 1.05);
  let rgb = hslRgb([h, s, l]);
  while (lum(rgb) > target && l > 0.05) { l -= 0.01; rgb = hslRgb([h, s, l]); }
  return rgb;
}
const deepColor = hex => `rgb(${darkenTo(hex, 0.12).join(',')})`;   // 글자용
const lineColor = hex => `rgb(${darkenTo(hex, 0.24).join(',')})`;   // 회색 바탕 위에서도 보이는 그래픽용
function applyTheme(m) {
  const r = document.documentElement.style;
  if (!m) { ['--accent', '--accent-line', '--accent-deep', '--accent-soft', '--accent-on'].forEach(k => r.removeProperty(k)); return; }
  const strong = darkenTo(m.color, 0.36);                              // 버튼 바탕
  r.setProperty('--accent', `rgb(${strong.join(',')})`);
  r.setProperty('--accent-line', lineColor(m.color));                  // 게이지, 진행바, 점
  r.setProperty('--accent-deep', deepColor(m.color));
  r.setProperty('--accent-soft', `rgba(${hexRgb(m.color).join(',')},0.2)`);
  const cr = (a, b) => (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
  r.setProperty('--accent-on', cr(lum(strong), 1) >= cr(lum(strong), lum([23, 23, 28])) ? '#FFFFFF' : '#17171C');
}

/* ---------------- 인트로 ---------------- */
$('crowd').innerHTML = MEMBERS.map(m =>
  `<span class="face" style="--m-color:${m.color}">${faceHTML(m)}</span>`).join('');

/* ---------------- 최애 선택 ---------------- */
function resetPick() {
  biasId = null;
  applyTheme(null);
  $('to-quiz').disabled = true;
  $('to-quiz').textContent = '한 명을 골라주세요';

}

function renderPick() {
  $('pick-grid').classList.toggle('has-pick', !!biasId);
  $('pick-grid').innerHTML = MEMBERS.map(m => `
    <button class="pick" data-id="${m.id}" aria-pressed="${biasId === m.id}" style="--m-color:${m.color}; --ring:${lineColor(m.color)}">

  $('pick-grid').querySelectorAll('.pick').forEach(btn => {
    btn.addEventListener('click', () => {

/* ---------------- 문항 ---------------- */
function renderQuestion() {
  const q = QUESTIONS[idx];
  const m = memberById(biasId);
  $('counter').textContent = `${idx + 1}/${QUESTIONS.length}`;
  $('q-face').style.setProperty('--m-color', m.color);
  $('q-face').innerHTML = faceHTML(m);
  $('counter-who').textContent = `${P.gwa(m.given)}의 궁합`;
  $('fill').style.width = `${((idx + 1) / QUESTIONS.length) * 100}%`;
  $('question').textContent = q.text;

  $('options').innerHTML = OPTIONS.map((label, i) => `
    <button class="opt" data-v="${i + 1}" aria-pressed="${answers[idx] === i + 1}">${label}</button>`).join('');

  $('options').querySelectorAll('.opt').forEach(b => {
    b.addEventListener('click', () => answer(parseInt(b.dataset.v, 10)));
  });

  $('back-q').disabled = idx === 0;
}

function answer(v) {
  answers[idx] = v;
  if (idx < QUESTIONS.length - 1) {
    idx++;
    renderQuestion();
  } else {
    finish();
  }
}

/* ---------------- 계산 ---------------- */
function userAxes() {
  const buckets = {};
  AXES.forEach(a => buckets[a.key] = []);
  QUESTIONS.forEach((q, i) => {
    let v = answers[i];
    if (q.rev) v = 6 - v;
    buckets[q.axis].push(v);
  });
  const out = {};
  Object.keys(buckets).forEach(k => {
    const avg = buckets[k].reduce((a, b) => a + b, 0) / buckets[k].length;
    out[k] = Math.round((avg - 1) * 25);
  });
  return out;
}

/* 총점 = 다섯 축에서 받은 점수의 합. 화면에 보이는 축별 점수를 더하면 그대로 총점이 된다 */
function compat(user, m) {
  const detail = AXES.map(a => {
    const gap = Math.abs(user[a.key] - m.axes[a.key]);
    const eff = Math.max(0, gap - a.tol);
    const ratio = Math.exp(-Math.pow(eff / SPREAD, 2));
    const got = Math.round(a.pts * ratio);
    return { axis: a, gap, eff, ratio, got, lost: a.pts - got, user: user[a.key], member: m.axes[a.key] };
  });
  const score = detail.reduce((sum, d) => sum + d.got, 0);
  return { score, detail };
}

/* 태그도 같은 비율로 판정해서 점수와 어긋나지 않게 한다 */
function levelOf(d) {
  if (d.ratio >= 0.85) return 3;
  if (d.ratio >= 0.55) return 2;
  if (d.ratio >= 0.2) return 1;
  return 0;
}

const TAGS = ['엇갈림', '조금 차이', '잘 맞음', '찰떡'];

function sentence(d, name) {
  const s = SAY[d.axis.key];
  const lv = levelOf(d);
  const up = d.user > d.member;
  if (lv === 3) return s.same(name);
  if (lv === 2) return s.near(name);
  if (lv === 1) return up ? s.midUp(name) : s.midDn(name);
  return up ? s.farUp(name) : s.farDn(name);
}

/* ---------------- 결과 ---------------- */
function finish() {
  const user = userAxes();
  const ranked = MEMBERS
    .map(m => ({ m, ...compat(user, m) }))
    .sort((a, b) => b.score - a.score);
  const mine = ranked.find(r => r.m.id === biasId);
  lastResult = { user, ranked, mine };
  renderResult(lastResult);
  show('screen-result');
}

function countUp(el, to) {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { el.textContent = to; return; }
  const start = performance.now(), dur = 1000;
  const step = now => {
    const p = Math.min(1, (now - start) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function renderResult({ ranked, mine }) {
  const m = mine.m;
  const name = m.given;

  $('res-face').style.setProperty('--m-color', m.color);
  $('res-face').innerHTML = faceHTML(m);
  $('res-label').textContent = `${P.gwa(m.name)}의 궁합`;
  $('legend-name').textContent = name;

  const band = BANDS.find(b => mine.score >= b.min);
  $('verdict').textContent = band.title;
  $('summary').textContent = band.text(name);

  // 게이지와 점수는 함께 차오른다
  const C = 2 * Math.PI * 68;
  const ring = $('ring');
  ring.style.transition = 'none';
  ring.style.strokeDashoffset = C;
  $('score-num').textContent = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    ring.style.transition = '';
    ring.style.strokeDashoffset = C * (1 - mine.score / 100);
    countUp($('score-num'), mine.score);
  }));

  const me = myType(lastResult.user);
  $('me-type').textContent = me.name;
  $('me-desc').textContent = me.lines.join(' ');
  $('me-bars').innerHTML = AXES.map(a => `
    <div class="me-row">
      <span class="nm">${a.name}</span>
      <div class="scale">
        <div class="rail"></div>
        <div class="mark you" style="left:${lastResult.user[a.key]}%"></div>
        <div class="ends"><span>${a.low}</span><span>${a.high}</span></div>
      </div>
    </div>`).join('');

  $('why-lead').textContent =
    `${m.vibe} 다섯 기준마다 나와 ${P.iga(name)} 서 있는 위치를 비교해서, 가까울수록 배점을 많이 받아요. 아래 점수를 모두 더한 게 총점이에요.`;

  $('axes').innerHTML = mine.detail.map(d => {
    const lv = levelOf(d);
    return `
      <div class="axis">
        <div class="axis-head">
          <span class="axis-name">${d.axis.name}</span>
          <span class="axis-right"><span class="got">${d.got}<small>/${d.axis.pts}</small></span><span class="tag t${lv}">${TAGS[lv]}</span></span>
        </div>
        <div class="scale">
          <div class="rail"></div>
          <div class="mark bias" style="left:${d.member}%"></div>
          <div class="mark you" style="left:${d.user}%"></div>
          <div class="ends"><span>${d.axis.low}</span><span>${d.axis.high}</span></div>
        </div>
        <p class="axis-say">${sentence(d, name)}</p>
      </div>`;
  }).join('');

  // 정리
  const best = [...mine.detail].sort((a, b) => b.ratio - a.ratio || b.axis.pts - a.axis.pts)[0];
  const worst = [...mine.detail].filter(d => d !== best).sort((a, b) => b.lost - a.lost || a.ratio - b.ratio)[0];
  const worstLab = worst.lost <= 2
    ? `${worst.axis.name}도 거의 안 깎였어요 (−${worst.lost}점)`
    : `가장 많이 깎인 건 ${worst.axis.name} (−${worst.lost}점)`;
  $('points').innerHTML = `
    <p class="point good"><span class="lab">${best.ratio >= 0.55 ? '가장 잘 맞는 건' : '그나마 가까운 건'} ${best.axis.name} (${best.got}/${best.axis.pts}점)</span>${sentence(best, name)}</p>
    <p class="point weak"><span class="lab">${worstLab}</span>${sentence(worst, name)}</p>`;

  // 순위
  const top = ranked[0];
  $('rank-lead').textContent = top.m.id === m.id
    ? `궁합만 따지면 ${P.iga(name)} 1위예요. 최애와 결과가 일치했어요.`
    : `점수만 보면 ${P.iga(top.m.given)} ${top.score}점으로 1위예요. 물론 최애는 점수로 정하는 게 아니지만요.`;

  $('rank-list').classList.remove('open');
  $('rank-toggle').textContent = '전체 순위 보기';
  $('rank-list').innerHTML = ranked.map((r, i) => `
    <div class="rank ${r.m.id === m.id ? 'is-pick' : ''}">
      <span class="n">${i + 1}</span>
      <span class="face" style="--m-color:${r.m.color}"><img src="${r.m.img}" alt="" loading="lazy"></span>
      <span class="nm">${r.m.name}${r.m.id === m.id ? '<span class="mine">내 최애</span>' : ''}</span>
      <span class="pc" style="color:${deepColor(r.m.color)}">${r.score}</span>
    </div>`).join('');
}


/* ---------------- 이벤트 ---------------- */
$('to-pick').addEventListener('click', () => { resetPick(); renderPick(); show('screen-pick'); });
$('back-intro').addEventListener('click', () => { resetPick(); show('screen-intro'); });

$('to-quiz').addEventListener('click', () => {
  if (!biasId) return;
  idx = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  renderQuestion();
  show('screen-quiz');
});

$('back-q').addEventListener('click', () => {
  if (idx > 0) { idx--; renderQuestion(); }
});

$('retry').addEventListener('click', () => {
  resetPick();
  show('screen-intro');
});

$('rank-toggle').addEventListener('click', e => {
  const open = $('rank-list').classList.toggle('open');
  e.target.textContent = open ? '순위 접기' : '전체 순위 보기';
});

document.addEventListener('keydown', e => {
  if (!$('screen-quiz').classList.contains('active')) return;
  if (['1','2','3','4','5'].includes(e.key)) answer(parseInt(e.key, 10));
});


/* ---------------- 복사 ---------------- */
function fallbackCopy(text) {
  try {
    const t = document.createElement('textarea');
    t.value = text;
    t.style.position = 'fixed';
    t.style.top = '-9999px';
    document.body.appendChild(t);
    t.focus(); t.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(t);
    return ok;
  } catch (err) { return false; }
}

function copyText(text) {
  return new Promise((res, rej) => {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(res).catch(() => fallbackCopy(text) ? res() : rej());
    } else {
      fallbackCopy(text) ? res() : rej();
    }
  });
}

function resultText() {
  const { mine } = lastResult;
  const best = [...mine.detail].sort((a, b) => b.ratio - a.ratio || b.axis.pts - a.axis.pts)[0];
  const worst = [...mine.detail].filter(d => d !== best).sort((a, b) => b.lost - a.lost)[0];
  return `[최애 궁합 테스트]\n내 성향: ${myType(lastResult.user).name}\n나 × ${mine.m.name} — 궁합 ${mine.score}점\n` +
         `가장 잘 맞는 축: ${best.axis.name} ${best.got}/${best.axis.pts}\n가장 많이 깎인 축: ${worst.axis.name} −${worst.lost}`;
}

$('share').addEventListener('click', async () => {
  if (!lastResult) return;
  const text = resultText();
  const btn = $('share');
  const original = btn.textContent;

  // 폰에서는 기본 공유 시트를 먼저 띄우고, 없으면 클립보드로 넘어간다
  if (navigator.share) {
    try {
      await navigator.share({ title: '최애 궁합 테스트', text });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }
  copyText(text)
    .then(() => { btn.textContent = '복사했어요'; setTimeout(() => btn.textContent = original, 1600); })
    .catch(() => { btn.textContent = '복사가 안 돼요'; setTimeout(() => btn.textContent = original, 2000); });
});
</script>
