# 사이트 올리기 (파일을 고쳐서 올릴 때만 돌아요)
# 방송 상태는 refresh.yml 이 몇 분마다 따로 받아요. 여기서는 예비용으로 한 번만 받아 둬요.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 스텔라이브 멤버 방송·클립 받기
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth 1 origin data && git show origin/data:stellive.json > stellive.json || true
          node fetch-stellive.mjs
      - name: 새 데이터 위치 알려 주기
        run: echo "window.DATA_URLS=[\"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/stellive.json\"];" > data-source.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
