# 사이트 올리기 + 치지직 라이브 목록 새로 받기
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  # 10분마다 라이브 목록을 새로 받아서 다시 올려요 (GitHub 사정에 따라 조금 늦을 수 있어요)
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 스텔라이브 멤버 방송·클립 받기
        continue-on-error: true
        run: node fetch-stellive.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
